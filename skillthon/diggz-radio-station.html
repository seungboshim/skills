<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Diggz Radio</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #0b0d10;
      --gun: #161b21;
      --panel: #1d232b;
      --line: #343c46;
      --text: #f2f4f6;
      --muted: #9099a4;
      --volt: #cfff04;
      --pink: #ff2e88;
      --chrome: linear-gradient(180deg, #fff 0%, #7f8994 46%, #eef1f4 53%, #7d8791 100%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text); background: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    button, a { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .shell { width: min(1240px, calc(100% - 40px)); margin: 0 auto; padding: 36px 0 64px; }
    header { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; }
    .wordmark {
      display: inline-block; margin: 0; font-size: clamp(44px, 7vw, 82px); font-weight: 400;
      line-height: .88; letter-spacing: -.085em; transform: skewX(8deg); transform-origin: left;
      background: var(--chrome); background-clip: text; -webkit-background-clip: text; color: transparent;
    }
    .tagline { margin: 14px 0 0; color: var(--muted); font: 700 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
    .scene { text-align: right; }
    .scene b { display: inline-block; padding: 7px 9px; color: var(--ink); background: var(--volt); font: 800 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .09em; }
    .scene span { display: block; margin-top: 9px; color: var(--muted); font: 700 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .hero { margin-top: 44px; border-top: 1px solid var(--line); padding-top: 30px; }
    .hero h1 { max-width: 900px; margin: 0; font-size: clamp(38px, 6vw, 76px); line-height: .98; letter-spacing: -.055em; }
    .task { margin: 18px 0 0; color: var(--muted); font-size: 17px; line-height: 1.5; }
    .task strong { color: var(--text); }
    .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
    .stats span { padding: 8px 10px; border: 1px solid var(--line); color: var(--muted); font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .stage { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr); gap: 20px; margin-top: 30px; }
    .player-panel, .now { border: 1px solid var(--line); background: var(--gun); }
    .player-panel { padding: 16px; }
    #player { width: 100%; aspect-ratio: 16 / 9; min-height: 270px; background: #000; }
    .controls { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 15px; }
    .controls button, .music-link {
      min-height: 44px; border: 1px solid var(--line); padding: 0 15px; color: var(--text); background: var(--panel);
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
      font: 750 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .controls button:hover, .music-link:hover { border-color: var(--muted); }
    #start { color: var(--ink); background: var(--volt); border-color: var(--volt); font-weight: 900; }
    #start:disabled { cursor: wait; opacity: .45; }
    .now { padding: 24px; display: flex; flex-direction: column; min-height: 100%; }
    .eyebrow { color: var(--volt); font: 800 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; }
    .now h2 { margin: 20px 0 5px; font-size: clamp(26px, 3vw, 42px); line-height: 1.05; letter-spacing: -.04em; }
    .artist { margin: 0; color: var(--muted); font-size: 18px; }
    .why { margin: 25px 0 0; padding-top: 20px; border-top: 1px solid var(--line); font-size: 16px; line-height: 1.6; }
    .track-meta { margin-top: auto; padding-top: 28px; color: var(--muted); font: 700 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .curve { margin-top: 20px; }
    .curve-head { display: flex; justify-content: space-between; color: var(--muted); font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; height: 60px; align-items: end; margin-top: 9px; }
    .bar { min-height: 3px; background: var(--volt); }
    .queue-head { display: flex; justify-content: space-between; align-items: end; margin: 54px 0 14px; }
    .queue-head h2 { margin: 0; font-size: 24px; letter-spacing: -.03em; }
    .queue-head span { color: var(--muted); font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .queue { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .track { display: grid; grid-template-columns: 50px 1fr auto; align-items: center; gap: 18px; padding: 17px 5px; border-bottom: 1px solid var(--line); }
    .track button { width: 38px; height: 38px; border: 1px solid var(--line); color: var(--text); background: transparent; cursor: pointer; font: 800 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .track.active { background: linear-gradient(90deg, rgba(207,255,4,.08), transparent 70%); }
    .track.active button { color: var(--ink); background: var(--volt); border-color: var(--volt); }
    .track.skipped { opacity: .42; }
    .track-title { font-weight: 800; font-size: 15px; }
    .track-sub { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .track-right { text-align: right; }
    .role { display: inline-block; color: var(--volt); font: 800 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
    .views { display: block; margin-top: 6px; color: var(--muted); font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    footer { margin-top: 46px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font: 650 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
    @media (max-width: 820px) {
      .shell { width: min(100% - 24px, 680px); padding-top: 24px; }
      header { grid-template-columns: 1fr; }
      .scene { text-align: left; }
      .stage { grid-template-columns: 1fr; }
      .now { min-height: 360px; }
      .track { grid-template-columns: 42px 1fr; }
      .track-right { grid-column: 2; text-align: left; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="wordmark">Diggz Radio</p><p class="tagline">MOOD COMPILER · 먼저 들은 귀가 이긴다</p></div>
      <div class="scene"><b id="scene"></b><span id="steer"></span></div>
    </header>

    <section class="hero">
      <h1 id="station-title"></h1>
      <p class="task"><strong id="task"></strong><br><span id="brief"></span></p>
      <div class="stats"><span id="track-count"></span><span id="duration"></span><span id="verified"></span></div>
    </section>

    <section class="stage">
      <div class="player-panel">
        <div id="player" aria-label="YouTube player"></div>
        <div class="controls">
          <button id="start" type="button" disabled>PLAYER LOADING</button>
          <button id="prev" type="button">← PREV</button>
          <button id="next" type="button">NEXT →</button>
          <a id="music-link" class="music-link" target="_blank" rel="noopener">YOUTUBE MUSIC에서 열기 ↗</a>
        </div>
      </div>
      <aside class="now">
        <span class="eyebrow" id="now-role">NOW CUEING</span>
        <h2 id="now-title"></h2>
        <p class="artist" id="now-artist"></p>
        <p class="why" id="now-why"></p>
        <div class="track-meta" id="now-meta"></div>
        <div class="curve">
          <div class="curve-head"><span>START</span><span>PEAK</span><span>LAND</span></div>
          <div class="bars" id="energy-bars"></div>
        </div>
      </aside>
    </section>

    <div class="queue-head"><h2>오늘의 크레이트</h2><span>CLICK A NUMBER TO JUMP</span></div>
    <ol class="queue" id="queue"></ol>

    <footer>
      YouTube 공식 IFrame Player로 재생한다. 소리는 세션 시작을 누른 뒤에만 난다.<br>
      조회수를 확인하지 못한 곡은 저점이라고 부르지 않는다. 재생 실패 곡은 표시하고 다음 곡으로 넘긴다.
    </footer>
  </main>

  <script id="station-data" type="application/json">{"title":"Four Tracks Out of the Loop","scene":"debug-loop","steer":"cool-down","task":"실패하는 테스트에서 잠깐 빠져나와 다시 집중하기","brief":"말랑한 드림팝으로 진입해 한 번만 크게 열고, 느린 질감으로 착륙하는 16분 데모","energy":[46,63,38],"duration_minutes":16,"verified_tracks":4,"discovery":{"source":"verified web search demo","verified_at":"2026-08-15T13:55:00+09:00","track_view_ceiling":1500000,"channel_view_ceiling":5000000,"queries":["recent indie dream pop official video"]},"tracks":[{"video_id":"DRpWu0OwSxU","title":"Air Between Us","artist":"Coral Grief","views":3263,"channel_views":null,"duration_seconds":133,"role":"entry","fit":"core","why":"짧고 흐릿한 기타 질감으로 실패 루프의 날카로운 첫 모서리를 낮춘다.","youtube_url":"https://www.youtube.com/watch?v=DRpWu0OwSxU","youtube_music_url":"https://music.youtube.com/watch?v=DRpWu0OwSxU"},{"video_id":"qogSKWTLNCw","title":"Baby Blue","artist":"Hazel English","views":78523,"channel_views":null,"duration_seconds":253,"role":"lock","fit":"core","why":"일정한 드림팝 리듬으로 다시 코드를 읽을 수 있는 안정 구간을 만든다.","youtube_url":"https://www.youtube.com/watch?v=qogSKWTLNCw","youtube_music_url":"https://music.youtube.com/watch?v=qogSKWTLNCw"},{"video_id":"-O1dQ3Nh8As","title":"graze","artist":"she's green","views":1354193,"channel_views":null,"duration_seconds":265,"role":"turn","fit":"adjacent","why":"중반에만 기타 층을 크게 열어 졸림을 깨우고 에너지 정점을 만든다.","youtube_url":"https://www.youtube.com/watch?v=-O1dQ3Nh8As","youtube_music_url":"https://music.youtube.com/watch?v=-O1dQ3Nh8As"},{"video_id":"B_y4PH8NZv0","title":"Push You Forever","artist":"Teethe","views":9163,"channel_views":null,"duration_seconds":291,"role":"landing","fit":"wildcard","why":"느린 드럼과 여백으로 열을 식히고 다음 테스트 한 번만 다시 돌릴 자리를 남긴다.","youtube_url":"https://www.youtube.com/watch?v=B_y4PH8NZv0","youtube_music_url":"https://music.youtube.com/watch?v=B_y4PH8NZv0"}]}</script>
  <script>
    const station = JSON.parse(document.getElementById('station-data').textContent);
    window.__DIGGZ_STATION__ = station;
    const tracks = station.tracks;
    let player;
    let activeIndex = 0;

    const $ = (id) => document.getElementById(id);
    const fmt = (value) => value == null ? '저점 확인 안 됨' : `${new Intl.NumberFormat('ko-KR').format(value)} views`;
    const clock = (seconds) => `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;

    $('scene').textContent = station.scene.toUpperCase();
    $('steer').textContent = `STEER / ${station.steer.toUpperCase()}`;
    $('station-title').textContent = station.title;
    $('task').textContent = station.task;
    $('brief').textContent = station.brief;
    $('track-count').textContent = `${tracks.length} TRACKS`;
    $('duration').textContent = `${station.duration_minutes} MIN`;
    $('verified').textContent = `저점 확인 ${station.verified_tracks}/${tracks.length}`;

    station.energy.forEach((energy) => {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = `${Math.max(4, energy)}%`;
      bar.title = String(energy);
      $('energy-bars').appendChild(bar);
    });

    tracks.forEach((track, index) => {
      const row = document.createElement('li');
      row.className = 'track';
      row.dataset.index = String(index);

      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = String(index + 1).padStart(2, '0');
      button.addEventListener('click', () => player && player.playVideoAt(index));

      const copy = document.createElement('div');
      const title = document.createElement('div');
      title.className = 'track-title';
      title.textContent = track.title;
      const sub = document.createElement('div');
      sub.className = 'track-sub';
      sub.textContent = `${track.artist} · ${clock(track.duration_seconds)} · ${track.fit}`;
      copy.append(title, sub);

      const right = document.createElement('div');
      right.className = 'track-right';
      const role = document.createElement('span');
      role.className = 'role';
      role.textContent = track.role.toUpperCase();
      const views = document.createElement('span');
      views.className = 'views';
      views.textContent = fmt(track.views);
      right.append(role, views);
      row.append(button, copy, right);
      $('queue').appendChild(row);
    });

    function show(index) {
      activeIndex = Math.max(0, Math.min(index, tracks.length - 1));
      const track = tracks[activeIndex];
      $('now-role').textContent = `NOW / ${track.role.toUpperCase()} · ${track.fit.toUpperCase()}`;
      $('now-title').textContent = track.title;
      $('now-artist').textContent = track.artist;
      $('now-why').textContent = track.why;
      $('now-meta').textContent = `${clock(track.duration_seconds)} · ${fmt(track.views)}`;
      $('music-link').href = track.youtube_music_url;
      document.querySelectorAll('.track').forEach((row, index) => row.classList.toggle('active', index === activeIndex));
    }
    show(0);

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('player', {
        width: '100%', height: '100%', videoId: tracks[0].video_id,
        playerVars: { playsinline: 1, rel: 0, origin: window.location.origin },
        events: {
          onReady: () => {
            player.cuePlaylist(tracks.map((track) => track.video_id), 0, 0);
            $('start').disabled = false;
            $('start').textContent = '▶ 세션 시작';
          },
          onStateChange: () => {
            const index = player.getPlaylistIndex();
            if (index >= 0) show(index);
          },
          onError: () => {
            const row = document.querySelector(`.track[data-index="${activeIndex}"]`);
            if (row) row.classList.add('skipped');
            $('start').textContent = '재생 불가 곡 건너뜀';
            window.setTimeout(() => player.nextVideo(), 500);
          }
        }
      });
    };

    $('start').addEventListener('click', () => {
      if (!player) return;
      player.playVideo();
      $('start').textContent = 'PLAYING';
    });
    $('prev').addEventListener('click', () => player && player.previousVideo());
    $('next').addEventListener('click', () => player && player.nextVideo());
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
